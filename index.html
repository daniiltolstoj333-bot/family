<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейный Дашборд Дежурств</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --neon-green: #10b981;
            --neon-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
            background-image: radial-gradient(circle at top right, rgba(139, 92, 246, 0.05), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.03), transparent 40%);
        }

        header {
            max-width: 1400px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo-section h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #10b981, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .current-date {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .top-controls {
            display: flex;
            gap: 12px;
        }

        button {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
            filter: brightness(1.1);
        }

        button.tg-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        button.tg-btn:hover {
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
        }

        .family-manager {
            max-width: 1400px;
            margin: 0 auto 30px auto;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .members-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .member-tag {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .member-tag input {
            background: transparent;
            border: none;
            color: white;
            font-weight: 600;
            width: 90px;
            font-size: 13px;
            outline: none;
        }

        .member-tag .remove-member {
            cursor: pointer;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            transition: color 0.2s;
        }
        .member-tag .remove-member:hover {
            color: #ef4444;
        }

        .dashboard-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 16px;
        }

        @media (max-width: 1200px) {
            .dashboard-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            header { flex-direction: column; gap: 15px; text-align: center; }
        }

        .day-column {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 550px;
            transition: all 0.3s ease;
            position: relative;
        }

        .day-column.today {
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
        }

        .today-badge {
            position: absolute;
            top: -10px;
            right: 15px;
            background: var(--neon-purple);
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.4);
        }

        .day-header {
            margin-bottom: 15px;
        }

        .day-name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .duty-selector {
            width: 100%;
            padding: 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .task-item {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid transparent;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: all 0.2s ease;
            position: relative;
        }

        .task-item:hover .delete-task {
            opacity: 1;
        }

        .priority-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-top: 3px;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.1s;
        }
        .priority-dot:active { transform: scale(0.8); }

        .priority-0 { background: #64748b; box-shadow: 0 0 6px #64748b; }
        .priority-1 { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
        .priority-2 { background: #ef4444; box-shadow: 0 0 12px #ef4444; }

        .task-item.p-1 { background: rgba(245, 158, 11, 0.06); border-color: rgba(245, 158, 11, 0.15); }
        .task-item.p-2 { background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.25); border-left: 3px solid #ef4444; }

        .task-text {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 13px;
            resize: none;
            width: 100%;
            height: auto;
            outline: none;
            font-family: inherit;
            line-height: 1.4;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
            opacity: 0.5;
        }
        .task-item.completed {
            background: rgba(15, 23, 42, 0.2) !important;
            border-color: transparent !important;
            border-left: none !important;
        }

        .delete-task {
            position: absolute;
            right: 8px;
            top: 10px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .delete-task:hover { color: #ef4444; }

        .add-task-btn {
            background: rgba(255,255,255,0.03);
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            box-shadow: none;
            width: 100%;
            justify-content: center;
        }
        .add-task-btn:hover {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
            border-color: rgba(255,255,255,0.2);
            box-shadow: none;
        }

        .color-0 { border-top: 4px solid #3b82f6; }
        .color-1 { border-top: 4px solid #ec4899; }
        .color-2 { border-top: 4px solid #10b981; }
        .color-3 { border-top: 4px solid #f59e0b; }
        .color-4 { border-top: 4px solid #06b6d4; }
        .color-5 { border-top: 4px solid #a855f7; }
        .color-none { border-top: 4px solid var(--border-color); }

        .trash-panel {
            max-width: 1400px;
            margin: 30px auto 0 auto;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 15px 20px;
        }
        .trash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .trash-title {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .trash-content {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .trash-item {
            background: rgba(15, 23, 42, 0.4);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .restore-btn {
            background: none;
            box-shadow: none;
            color: var(--neon-green);
            padding: 2px 8px;
            font-size: 11px;
        }
        .restore-btn:hover { background: rgba(16, 185, 129, 0.1); box-shadow: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <h1>📊 Семейная Матрица Дежурств</h1>
            <div class="current-date" id="liveDate">Понедельник, 1 января</div>
        </div>
        <div class="top-controls">
            <button class="tg-btn" onclick="exportData()">📤 Код для Telegram</button>
            <button class="tg-btn" onclick="importData()">📥 Вставить код</button>
            <button style="background: #a80000; box-shadow: none;" onclick="clearSystem()">🧹 Очистить всё</button>
        </div>
    </header>

    <div class="family-manager">
        <div class="section-title">👥 Состав семьи (Редактируйте имена прямо тут)</div>
        <div class="members-tags" id="familyTags"></div>
        <button style="margin-top: 15px; padding: 6px 12px; font-size: 12px;" onclick="addMember()">➕ Добавить участника</button>
    </div>

    <div class="dashboard-grid" id="grid"></div>

    <div class="trash-panel">
        <div class="trash-header" onclick="toggleTrash()">
            <div class="trash-title">🗑️ Безопасная Корзина (<span id="trashCount">0</span>)</div>
            <div style="font-size: 12px; color: var(--text-muted);">Развернуть/Свернуть</div>
        </div>
        <div class="trash-content" id="trashContent" style="display: none;"></div>
    </div>

    <script>
        const daysOrdered = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
        const daysEng = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
        const memberColors = ['#3b82f6', '#ec4899', '#10b981', '#f59e0b', '#06b6d4', '#a855f7'];

        let state = {
            members: ["Папа", "Мама", "Старший сын", "Младший сын", "Дочь", "Бабушка"],
            schedule: {
                mon: { responsible: "Мама", tasks: [] },
                tue: { responsible: "Папа", tasks: [] },
                wed: { responsible: "Старший сын", tasks: [] },
                thu: { responsible: "Младший сын", tasks: [] },
                fri: { responsible: "Дочь", tasks: [] },
                sat: { responsible: "Бабушка", tasks: [] },
                sun: { responsible: "Никто", tasks: [] }
            },
            trash: []
        };

        if(localStorage.getItem('family_matrix_state')) {
            state = JSON.parse(localStorage.getItem('family_matrix_state'));
        }

        function save() {
            localStorage.setItem('family_matrix_state', JSON.stringify(state));
        }

        function initCalendar() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date();
            document.getElementById('liveDate').textContent = today.toLocaleDateString('ru-RU', options);
            let currentDayIdx = today.getDay();
            let convertedIdx = currentDayIdx === 0 ? 6 : currentDayIdx - 1;
            window.currentDayKey = daysEng[convertedIdx];
        }

        function renderFamilyManager() {
            const container = document.getElementById('familyTags');
            container.innerHTML = '';
            state.members.forEach((name, index) => {
                const color = memberColors[index % memberColors.length];
                const tag = document.createElement('div');
                tag.className = 'member-tag';
                tag.style.backgroundColor = color + '15';
                tag.style.borderColor = color + '40';
                tag.style.color = color;

                const input = document.createElement('input');
                input.value = name;
                input.style.color = color;
                input.oninput = (e) => {
                    const oldName = state.members[index];
                    state.members[index] = e.target.value;
                    daysEng.forEach(day => {
                        if(state.schedule[day].responsible === oldName) {
                            state.schedule[day].responsible = e.target.value;
                        }
                    });
                    save();
                    renderSelectorsOnly();
                };

                const close = document.createElement('span');
                close.className = 'remove-member';
                close.innerHTML = '✕';
                close.onclick = () => {
                    if(confirm(`Удалить ${name} из состава семьи?`)) {
                        state.trash.push({ type: 'member', name: state.members[index] });
                        state.members.splice(index, 1);
                        save();
                        renderAll();
                    }
                };

                tag.appendChild(input);
                tag.appendChild(close);
                container.appendChild(tag);
            });
        }

        function renderSelectorsOnly() {
            daysEng.forEach(dayKey => {
                const select = document.querySelector(`.select-${dayKey}`);
                if (select) {
                    const currentVal = state.schedule[dayKey].responsible;
                    select.innerHTML = '';
                    
                    const optNone = document.createElement('option');
                    optNone.value = "Никто";
                    optNone.textContent = "💤 Нет дежурного";
                    if(currentVal === "Никто") optNone.selected = true;
                    select.appendChild(optNone);

                    state.members.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m;
                        opt.textContent = `👤 ${m}`;
                        if(currentVal === m) opt.selected = true;
                        select.appendChild(opt);
                    });
                }
            });
        }

        function addMember() {
            const name = prompt("Введите имя нового члена семьи:");
            if(name && name.trim()) {
                state.members.push(name.trim());
                save();
                renderAll();
            }
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            daysOrdered.forEach((dayName, idx) => {
                const dayKey = daysEng[idx];
                const dayData = state.schedule[dayKey];
                const isToday = dayKey === window.currentDayKey;
                const memberIdx = state.members.indexOf(dayData.responsible);
                const borderClass = memberIdx !== -1 ? `color-${memberIdx % memberColors.length}` : 'color-none';

                const col = document.createElement('div');
                col.className = `day-column ${borderClass} ${isToday ? 'today' : ''}`;
                
                if(isToday) {
                    const badge = document.createElement('div');
                    badge.className = 'today-badge';
                    badge.textContent = 'Сегодня';
                    col.appendChild(badge);
                }

                const headerDiv = document.createElement('div');
                headerDiv.className = 'day-header';
                headerDiv.innerHTML = `<div class="day-name">${dayName}</div>`;

                const select = document.createElement('select');
                select.className = `duty-selector select-${dayKey}`;
                
                const optNone = document.createElement('option');
                optNone.value = "Никто";
                optNone.textContent = "💤 Нет дежурного";
                if(dayData.responsible === "Никто") optNone.selected = true;
                select.appendChild(optNone);

                state.members.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = `👤 ${m}`;
                    if(dayData.responsible === m) opt.selected = true;
                    select.appendChild(opt);
                });

                select.onchange = (e) => {
                    dayData.responsible = e.target.value;
                    save();
                    renderGrid();
                };

                headerDiv.appendChild(select);
                col.appendChild(headerDiv);

                const listDiv = document.createElement('div');
                listDiv.className = 'tasks-list';

                dayData.tasks.forEach((task, taskIdx) => {
                    const item = document.createElement('div');
                    item.className = `task-item p-${task.priority} ${task.done ? 'completed' : ''}`;

                    const dot = document.createElement('div');
                    dot.className = `priority-dot priority-${task.priority}`;
                    dot.onclick = () => {
                        task.priority = (task.priority + 1) % 3;
                        save();
                        renderGrid();
                    };

                    const text = document.createElement('textarea');
                    text.className = 'task-text';
                    text.value = task.text;
                    text.rows = 1;
                    text.placeholder = "Напишите задачу...";
                    text.oninput = (e) => {
                        task.text = e.target.value;
                        save();
                    };
                    text.ondblclick = () => {
                        task.done = !task.done;
                        save();
                        renderGrid();
                    };

                    const del = document.createElement('div');
                    del.className = 'delete-task';
                    del.innerHTML = '✕';
                    del.onclick = () => {
                        state.trash.push({ type: 'task', dayKey, task, index: taskIdx });
                        dayData.tasks.splice(taskIdx, 1);
                        save();
                        renderAll();
                    };

                    item.appendChild(dot);
                    item.appendChild(text);
                    item.appendChild(del);
                    listDiv.appendChild(item);
                });

                col.appendChild(listDiv);

                const addBtn = document.createElement('button');
                addBtn.className = 'add-task-btn';
                addBtn.innerHTML = '➕ Добавить задачу';
                addBtn.onclick = () => {
                    dayData.tasks.push({ text: '', priority: 0, done: false });
                    save();
                    renderGrid();
                };

                col.appendChild(addBtn);
                grid.appendChild(col);
            });
        }

        function renderTrash() {
            document.getElementById('trashCount').textContent = state.trash.length;
            const content = document.getElementById('trashContent');
            content.innerHTML = '';

            if(state.trash.length === 0) {
                content.innerHTML = '<div style="color: var(--text-muted); font-size:12px;">Корзина пуста</div>';
                return;
            }

            state.trash.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'trash-item';
                if(item.type === 'member') {
                    row.innerHTML = `<span>Участник: <b>${item.name}</b></span>`;
                } else {
                    row.innerHTML = `<span>Задача из дня (${item.dayKey}): "${item.task.text || 'Пустая задача'}"</span>`;
                }

                const rBtn = document.createElement('button');
                rBtn.className = 'restore-btn';
                rBtn.textContent = 'Восстановить';
                rBtn.onclick = () => {
                    if(item.type === 'member') {
                        state.members.push(item.name);
                    } else {
                        if(state.schedule[item.dayKey]) {
                            state.schedule[item.dayKey].tasks.push(item.task);
                        }
                    }
                    state.trash.splice(idx, 1);
                    save();
                    renderAll();
                };

                row.appendChild(rBtn);
                content.appendChild(row);
            });
        }

        function toggleTrash() {
            const content = document.getElementById('trashContent');
            content.style.display = content.style.display === 'none' ? 'flex' : 'none';
        }

        function exportData() {
            const code = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
            navigator.clipboard.writeText(code);
            alert("🚀 Код расписания скопирован в буфер обмена! Перешлите его через Telegram.");
        }

        function importData() {
            const code = prompt("Вставьте зашифрованный код расписания:");
            if(code) {
                try {
                    const parsed = JSON.parse(decodeURIComponent(escape(atob(code))));
                    if(parsed.members && parsed.schedule) {
                        state = parsed;
                        save();
                        renderAll();
                        alert("✨ База данных дежурств успешно обновлена!");
                    } else {
                        alert("Неверный формат данных!");
                    }
                } catch(e) {
                    alert("Ошибка при расшифровке кода.");
                }
            }
        }

        function clearSystem() {
            if(confirm("Вы действительно хотите полностью стереть все записи?")) {
                localStorage.removeItem('family_matrix_state');
                location.reload();
            }
        }

        function renderAll() {
            renderFamilyManager();
            renderGrid();
            renderTrash();
        }

        initCalendar();
        renderAll();
    </script>
</body>
</html>
